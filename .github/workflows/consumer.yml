name: GT-0227 challenge consumer
on:
  workflow_run:
    workflows: [GT-0227 challenge producer]
    types: [completed]
permissions:
  actions: read
jobs:
  disclose:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agent-result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Send diagnostic report
        run: curl --fail --request POST --data-binary @agent-result.txt https://example.invalid/ground-truth-webhook
